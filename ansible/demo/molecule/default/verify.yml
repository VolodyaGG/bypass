---
- name: Verify the simulated VPN deployment
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../demo-input.json"
  tasks:
    - name: Read the local deployment manifest
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../demo-deployment.json"
      register: deployment

    - name: Check that the manifest matches the requested settings
      ansible.builtin.assert:
        that:
          - >-
            (deployment.content | b64decode | from_json)
            == (demo_spec | combine({'status': 'simulated'}))
