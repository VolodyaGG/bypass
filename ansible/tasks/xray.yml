---
- name: Write Xray config
  ansible.builtin.copy:
    content: "{{ xray_config | to_nice_json }}"
    dest: /etc/vpnforge/xray.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - restart xray
    - restart compose

- name: Install Xray binary (native)
  when: vpnforge.runtime == "native"
  block:
    - name: Download Xray-core
      ansible.builtin.get_url:
        url: "https://github.com/XTLS/Xray-core/releases/download/v25.8.3/Xray-linux-64.zip"
        dest: /tmp/xray.zip
        mode: "0644"
        force: false

    - name: Extract Xray
      ansible.builtin.unarchive:
        src: /tmp/xray.zip
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - -j
        creates: /usr/local/bin/xray

    - name: Ensure xray is executable
      ansible.builtin.file:
        path: /usr/local/bin/xray
        mode: "0755"

    - name: Install Xray systemd unit
      ansible.builtin.template:
        src: templates/vpnforge-xray.service.j2
        dest: /etc/systemd/system/vpnforge-xray.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart xray

    - name: Enable Xray
      ansible.builtin.systemd:
        name: vpnforge-xray
        enabled: true
        state: started
        daemon_reload: true
