[tool.poetry]
name = "vpnforge"
version = "0.1.0"
description = "Local FastAPI backend that deploys a VPN stack to a clean VPS via Ansible"
authors = ["VPN-Forge"]
readme = "README.md"
packages = [{ include = "vpnforge" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
jinja2 = "^3.1"
pyyaml = "^6.0"
requests = "^2.32"
tenacity = "^9.0"
pydantic = "^2.9"
pydantic-settings = "^2.6"
cryptography = "^43.0"
python-multipart = "^0.0.12"
sse-starlette = "^2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = "^0.27"
responses = "^0.25"
freezegun = "^1.5"
ruff = "^0.7"
mypy = "^1.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=vpnforge --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
